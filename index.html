<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1410" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Panda Stampede" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<title>Panda Stampede</title>
<meta name="description" content="Panda Stampede — crowd runner où tu choisis entre combattre et apprivoiser pour bâtir une armée hybride." />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b1410; overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
  }
  body {
    /* 100dvh suit la barre d'adresse mobile qui apparaît et disparaît ;
       la valeur 100% reste le repli pour les navigateurs plus anciens. */
    height: 100%; height: 100dvh;
    touch-action: none; overscroll-behavior: none;
    position: fixed; inset: 0;
  }
  /* #game réserve les zones d'encoche et de barre système (iPhone, Android à
     bords incurvés) ; #stage, à l'intérieur, est le parent réel du canvas. */
  #game {
    width: 100%; height: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* Pas de centrage flex ici : Phaser centre déjà le canvas par ses marges,
     et cumuler les deux le décalait d'un quart d'écran sur ordinateur. */
  #stage { width: 100%; height: 100%; display: block; position: relative; }
  #stage canvas { display: block; touch-action: none; }

  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(circle at 50% 35%, #1c3b2c 0%, #0b1410 70%);
    color: #e8f5e9; text-align: center; padding: 24px; z-index: 10;
    transition: opacity .45s ease;
  }
  #boot.hidden { opacity: 0; pointer-events: none; }
  #boot .glyph { font-size: 68px; line-height: 1; animation: bob 1.6s ease-in-out infinite; }
  #boot h1 { margin: 0; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; color: #a7f3d0; }
  #boot p { margin: 0; font-size: 14px; opacity: .75; max-width: 32ch; line-height: 1.5; }
  #boot .err { color: #fca5a5; font-size: 13px; max-width: 40ch; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
  @media (prefers-reduced-motion: reduce) { #boot .glyph { animation: none } }

  /* Téléphone tenu en paysage : le jeu est conçu en portrait, on le dit
     plutôt que d'afficher une piste de 200 px de large. Les ordinateurs, dont
     la fenêtre paysage est bien plus haute, ne sont pas concernés. */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 20;
    background: #0b1410; color: #e8f5e9; text-align: center;
    flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  }
  #rotate .glyph { font-size: 56px; animation: spin 2.4s ease-in-out infinite; }
  #rotate p { margin: 0; font-size: 16px; opacity: .85; }
  @keyframes spin { 0%,20% { transform: rotate(0) } 50%,70% { transform: rotate(90deg) } 100% { transform: rotate(0) } }
  @media (orientation: landscape) and (max-height: 520px) and (pointer: coarse) {
    #rotate { display: flex; }
  }

  /* Mode d'emploi d'installation (iOS n'a pas d'invite native) */
  #install-help {
    display: none; position: fixed; inset: 0; z-index: 30;
    background: rgba(2, 6, 23, .92); color: #e8f5e9;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 28px; text-align: center;
  }
  #install-help.show { display: flex; }
  #install-help h2 { margin: 0; font-size: 22px; color: #a7f3d0; }
  #install-help ol { margin: 0; padding-left: 22px; text-align: left; font-size: 16px; line-height: 1.7; max-width: 34ch; }
  #install-help button {
    margin-top: 8px; font: inherit; font-size: 17px; font-weight: bold;
    padding: 12px 28px; border: 0; border-radius: 14px; background: #22c55e; color: #062314;
  }

  /* Diagnostic : ?debug dans l'adresse */
  #diag {
    display: none; position: fixed; left: 6px; bottom: 6px; z-index: 40;
    font: 11px/1.4 monospace; color: #a7f3d0; background: rgba(0,0,0,.6);
    padding: 6px 8px; border-radius: 6px; pointer-events: none; white-space: pre;
  }
</style>
</head>
<body>
  <div id="game"><div id="stage"></div></div>
  <div id="rotate">
    <div class="glyph">📱</div>
    <p>Tourne ton téléphone en portrait</p>
  </div>
  <div id="install-help">
    <h2>📲 Installer sur l'écran d'accueil</h2>
    <ol id="install-steps"></ol>
    <button type="button" id="install-close">Compris</button>
  </div>
  <div id="diag"></div>
  <div id="boot">
    <div class="glyph">🐼</div>
    <h1>Panda Stampede</h1>
    <p id="boot-msg">Chargement du dojo…</p>
  </div>
  <script>
  // --- Installation (PWA) ---------------------------------------------------
  // Android/Chrome émet `beforeinstallprompt` : on le garde sous le coude pour
  // que le bouton « Installer » du menu déclenche la vraie invite système.
  // iOS n'a pas d'équivalent : on affiche la marche à suivre.
  window.__installPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__installPrompt = e;
  });
  window.__isStandalone = function () {
    return window.matchMedia('(display-mode: standalone)').matches
      || window.matchMedia('(display-mode: fullscreen)').matches
      || window.navigator.standalone === true;
  };
  window.__requestInstall = function () {
    if (window.__installPrompt) {
      var ev = window.__installPrompt;
      window.__installPrompt = null;
      ev.prompt();
      return 'prompt';
    }
    var ua = navigator.userAgent;
    var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var steps = document.getElementById('install-steps');
    steps.innerHTML = '';
    var list = ios
      ? ['Touche le bouton Partager (le carré avec une flèche) en bas de Safari',
         'Fais défiler et choisis « Sur l\'écran d\'accueil »',
         'Touche « Ajouter » : le jeu s\'ouvre ensuite en plein écran, comme une app']
      : ['Ouvre le menu du navigateur (⋮ ou ⋯)',
         'Choisis « Installer l\'application » ou « Ajouter à l\'écran d\'accueil »',
         'Confirme : le jeu s\'ouvre ensuite en plein écran, comme une app'];
    list.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; steps.appendChild(li); });
    document.getElementById('install-help').classList.add('show');
    return ios ? 'ios-help' : 'help';
  };
  document.getElementById('install-close').addEventListener('click', function () {
    document.getElementById('install-help').classList.remove('show');
  });

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* hors-ligne indisponible, le jeu marche quand même */ });
    });
  }

  // --- Diagnostic (?debug) --------------------------------------------------
  window.__diag = /[?&]debug/.test(location.search) ? document.getElementById('diag') : null;
  if (window.__diag) window.__diag.style.display = 'block';

  (function () {
    var msg = document.getElementById('boot-msg');
    // Phaser est embarqué dans le dépôt : la page est autonome, sans CDN.
    // Les deux CDN ne servent que de filet de secours.
    var SOURCES = [
      './vendor/phaser.min.js',
      'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js'
    ];
    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = src; s.async = false;
        s.onload = resolve;
        s.onerror = function () { reject(new Error('fail ' + src)); };
        document.head.appendChild(s);
      });
    }
    function fail(text) {
      msg.className = 'err';
      msg.textContent = text;
    }
    (async function () {
      for (var i = 0; i < SOURCES.length; i++) {
        try { await loadScript(SOURCES[i]); } catch (e) { /* try next CDN */ }
        if (window.Phaser) break;
      }
      if (!window.Phaser) {
        fail("Impossible de charger Phaser 3 depuis le CDN. Vérifie ta connexion puis recharge la page.");
        return;
      }
      try {
        await import('./src/main.js');
      } catch (e) {
        console.error(e);
        fail("Erreur au démarrage du jeu : " + (e && e.message ? e.message : e) +
             "\nSi tu ouvres le fichier en local, lance un serveur (python3 -m http.server) au lieu de double-cliquer sur index.html.");
      }
    })();
  })();
  </script>
</body>
</html>
